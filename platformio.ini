[env:m5stack-stamps3]
platform                        = espressif32
board                           = m5stack-stamps3
framework                       = arduino
monitor_speed                   = 115200
monitor_filters                 = esp32_exception_decoder, default

; ── Upload ───────────────────────────────────────────────────────────────────
upload_speed                    = 921600
upload_port                     = COM4
monitor_port                    = COM4
upload_protocol                 = esptool
upload_flags                    =
    --before=usb_reset
    --after=hard_reset

; ── Board ────────────────────────────────────────────────────────────────────
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
; M5Dial = ESP32-S3-WROOM-1 N16R8 (16 MB Flash + 8 MB OPI-PSRAM)
; WITHOUT qio_opi the OPI-PSRAM is initialised in the wrong mode →
; first PSRAM heap alloc (sprite) faults → reset → bootloop ("kurz hell, dunkel")
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_build.partitions          = default_16MB.csv

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
    m5stack/M5GFX         @ ^0.2.0

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -D M5_RESCUE_DIRECT_ONLY=1
    ; Spartan Hub ESP-NOW (Bus profile / Spartan3-Setup ch6)
    -D ENABLE_ESP_NOW_CLIENT=1
    -D ESP_NOW_WIFI_CHANNEL=6
