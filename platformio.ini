[env:m5stack-stamps3]
; Gepinnt auf Core 2.0.17 (Arduino-ESP32 2.x). espressif32 7.x / pioarduino 5x.x
; = Core 3.x -> WiFi-PHY-Einschaltstoss loest dort Brownout-Reset bei WiFi.mode()
; aus (RTC_SW_SYS_RST, rtc_brownout_isr_handler). 2.x lief stabil.
platform                        = espressif32 @ 6.13.0
board                           = m5stack-stamps3
framework                       = arduino
monitor_speed                   = 115200
monitor_filters                 = esp32_exception_decoder, default

; ── Upload ───────────────────────────────────────────────────────────────────
upload_speed                    = 921600
upload_port                     = COM4
monitor_port                    = COM4
upload_protocol                 = esptool
upload_flags                    =
    --before=usb_reset
    --after=hard_reset

; ── Board ────────────────────────────────────────────────────────────────────
board_build.f_cpu               = 240000000L
board_build.f_flash             = 80000000L
board_build.flash_mode          = qio
; M5Dial = M5StampS3 (ESP32-S3FN8): 8 MB Flash, KEIN PSRAM.
; Daher qio_qspi (kein OPI) und Board-Default 8MB-Flash/Partitionen (kein 16MB!).
board_build.arduino.memory_type = qio_qspi

; ── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.0.0
    m5stack/M5GFX         @ ^0.2.0

; ── Build flags ──────────────────────────────────────────────────────────────
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    ; Spartan Hub ESP-NOW (Bus profile / Spartan3-Setup ch6)
    -D ENABLE_ESP_NOW_CLIENT=1
    -D ESP_NOW_WIFI_CHANNEL=6
